name: falcon-reid

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: falcon
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-falcon}
    volumes:
      - falcon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    shm_size: "2gb"
    environment:
      DATA_ROOT: /data
      GALLERY_INDEX: /app/models/gallery_index.npz
      DATABASE_URL: postgresql+asyncpg://falcon:${POSTGRES_PASSWORD:-falcon}@postgres:5432/falcon
      JWT_SECRET: ${JWT_SECRET:-falcon-local-development-secret}
      REFUSAL_THRESHOLD: ${REFUSAL_THRESHOLD:-0.302}
    volumes:
      - ./backend/data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 180s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  falcon-postgres:
